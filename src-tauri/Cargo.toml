[package]
name = "lead"
version = "1.0.0"
description = "LEAD by NEN"
authors = ["NEN"]
edition = "2021"

[lib]
name = "lead_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lead"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
